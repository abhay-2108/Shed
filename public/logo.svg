<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="shed-bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#344136"/>
      <stop offset="100%" stop-color="#202a21"/>
    </linearGradient>

    <!-- Craftsman terracotta roof gradient -->
    <linearGradient id="shed-roof" x1="16" y1="11" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ee8559"/>
      <stop offset="60%" stop-color="#d46741"/>
      <stop offset="100%" stop-color="#ba5330"/>
    </linearGradient>

    <!-- Workshop interior terminal glow -->
    <radialGradient id="shed-glow" cx="32" cy="42" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ee2c0" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7ee2c0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Badge Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#shed-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" fill="none"/>

  <!-- Foundation Slab -->
  <rect x="13" y="50" width="38" height="3" rx="1.5" fill="#171e18"/>

  <!-- Timber Wall Body -->
  <path d="M16 28 L32 16 L48 28 V50 H16 Z" fill="#ede5d5"/>

  <!-- Timber Siding Planks (grooves) -->
  <line x1="16" y1="34" x2="48" y2="34" stroke="#ddcbba" stroke-width="1"/>
  <line x1="16" y1="39.5" x2="48" y2="39.5" stroke="#ddcbba" stroke-width="1"/>
  <line x1="16" y1="45" x2="48" y2="45" stroke="#ddcbba" stroke-width="1"/>

  <!-- Craftsman Eave Shadow -->
  <path d="M16 28 L32 16 L48 28 L48 31 L32 19 L16 31 Z" fill="#242d25" opacity="0.12"/>

  <!-- Gabled Craftsman Roof with Overhang -->
  <path d="M32 11 L55 27.5 L52 30.5 L32 15.5 L12 30.5 L9 27.5 Z" fill="url(#shed-roof)"/>

  <!-- Roof Ridge Cap Highlight -->
  <path d="M32 11 L35 13.2 L32 15.5 L29 13.2 Z" fill="#ffa77f" opacity="0.6"/>

  <!-- Loft Window in Gable -->
  <circle cx="32" cy="23" r="3.6" fill="#885b3e"/>
  <circle cx="32" cy="23" r="2.75" fill="#7ee2c0" opacity="0.85"/>
  <line x1="32" y1="20.25" x2="32" y2="25.75" stroke="#2e2118" stroke-width="0.75"/>
  <line x1="29.25" y1="23" x2="34.75" y2="23" stroke="#2e2118" stroke-width="0.75"/>

  <!-- Workshop Entrance Doorway -->
  <!-- Door frame / trim -->
  <rect x="23" y="31.5" width="18" height="18.5" rx="2" fill="#885b3e"/>
  <!-- Door interior (dark terminal workspace) -->
  <rect x="24.5" y="33" width="15" height="17" rx="1.2" fill="#111612"/>
  <!-- Ambient Terminal Glow -->
  <ellipse cx="32" cy="42" rx="7" ry="5.5" fill="url(#shed-glow)"/>

  <!-- Coding Agent Prompt inside doorway: ❯ _ -->
  <path d="M28 39.5 L30.5 41.5 L28 43.5" stroke="#7ee2c0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32.5" y1="43.5" x2="35.5" y2="43.5" stroke="#7ee2c0" stroke-width="1.6" stroke-linecap="round"/>
</svg>